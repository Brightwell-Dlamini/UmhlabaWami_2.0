<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>Umhlaba Wami — Commercial Property Management</title>
    <meta
      name="description"
      content="Umhlaba Wami — commercial property management for the Kingdom of Eswatini."
    />
    <meta name="application-name" content="Umhlaba Wami" />

    <!-- Theme (browser chrome + PWA splash) -->
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS / Safari “Add to Home Screen” -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Umhlaba Wami" />
    <link rel="apple-touch-icon" href="/Umhlaba%20Wami%20logo%20p.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Umhlaba%20Wami%20logo%20p.png" />

    <!-- Inter Variable + Inter Display -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- Geist Mono for numeric and code surfaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
